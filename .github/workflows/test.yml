name: Quality Gates

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root quality dependencies
        run: npm ci

      - name: Lint checks (HTML/CSS/JS)
        run: npm run lint

      - name: Formatting checks
        run: npm run format:check

      - name: Link checks
        run: npm run linkcheck

      - name: Lighthouse performance/a11y budgets
        run: npm run lighthouse:ci

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright test dependencies
        run: npm --prefix tests ci

      - name: Install system dependencies for Playwright browsers
        run: npm --prefix tests exec playwright install-deps

      - name: Install Playwright browsers
        run: npm --prefix tests exec playwright install chromium webkit

      - name: Run full Playwright suite (includes accessibility assertions)
        run: npm --prefix tests test

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 30
