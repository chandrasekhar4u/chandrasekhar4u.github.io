version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting brand-new releases (supply-chain hygiene);
    # security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      npm-root:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
    # Wait a week before adopting brand-new releases (supply-chain hygiene);
    # security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      npm-tests:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting brand-new releases (supply-chain hygiene);
    # security updates are not delayed by cooldown.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
